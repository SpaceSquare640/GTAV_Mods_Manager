name: CI

on:
  push:
    branches: [Source_Code]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # libdbus-1-dev: keyring's sync-secret-service backend (ai_assistant's Linux
        # credential store) links against libdbus at build time via pkg-config.
        # The rest (webkit2gtk/gtk/glib/appindicator/rsvg/dbus dev headers): gtavmm-app
        # is a Tauri app and has been part of `cargo test --workspace`/`cargo build
        # --workspace` since it was scaffolded — this was missing from CI from that
        # point on (a real, previously-undetected gap: every Linux CI run since
        # 2026-08-27 failed at the `glib-sys` build script with "Package glib-2.0 was
        # not found", found while diagnosing the very first release workflow run).
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build (workspace)
        run: cargo build --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
