name: Release

# Builds real Tauri installers (Windows .msi/.exe, Linux .deb/.rpm) for
# gtavmm-app and publishes them as a GitHub Release, gated by the full test suite.
# Matches the project's "installer only, no portable/CLI-only release" policy (see the
# planning vault) — this replaces the earlier interim CLI-binary-only workflow that was
# a stand-in until gtavmm-app existed. Not code-signed (no certificate configured yet)
# — installers will show an "unknown publisher" warning on Windows/macOS until that's
# set up separately.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test-gate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - run: cargo test --workspace

  build-and-publish:
    needs: test-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gtavmm-app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: crates/gtavmm-app
        run: npm ci

      - name: Build and publish Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/gtavmm-app
          # Installers only, per the project's release policy — AppImage is a portable
          # executable, not a traditional installer, so it's excluded on Linux.
          args: ${{ matrix.platform == 'ubuntu-latest' && '--bundles deb,rpm' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "GTAV Mods Manager ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG / commit history for details. Installers are unsigned — Windows SmartScreen / macOS Gatekeeper may warn on first run."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
