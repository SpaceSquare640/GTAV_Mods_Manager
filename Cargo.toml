[workspace]
resolver = "2"
members = [
    "crates/gtavmm-core",
    "crates/gtavmm-cli",
    "crates/gtavmm-app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["SpaceSquare"]
repository = "https://github.com/SpaceSquare640/GTAV_Mods_Manager"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
zip = "2"
sevenz-rust = "0.6"
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
keyring = "3"
rpf-archive = "0.7"

[workspace.dependencies.winreg]
version = "0.52"

[workspace.dependencies.ureq]
version = "2"
default-features = false
features = ["tls", "json"]

[workspace.dependencies.rust_xlsxwriter]
version = "0.79"
